$kind: http-request
name: Logout
description: "Rota pública (Aula 16). Revoga a família do refreshToken informado e responde 204. É idempotente: um token desconhecido também responde 204. Não invalida o access token já emitido, que segue válido até expirar (30 min)."
url: http://localhost:8080/api/autenticacao/logout
method: POST
auth:
  type: noauth
body:
  type: json
  content: "{\r\n  \"refreshToken\": \"{{refreshToken}}\"\r\n}"
scripts:
  - type: afterResponse
    code: |-
      pm.test('Logout responde 204', function () {
          pm.response.to.have.status(204);
      });
    language: text/javascript
order: 4485315013079003
