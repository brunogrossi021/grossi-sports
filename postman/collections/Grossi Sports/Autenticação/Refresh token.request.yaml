$kind: http-request
name: Refresh token
description: "Rota pública (Aula 16). Envia o refreshToken (obtido no login) e recebe um novo par de tokens com rotação. O script atualiza accessToken e refreshToken na coleção. Reutilizar um token já trocado revoga a família e responde 401."
url: http://localhost:8080/api/autenticacao/refresh
method: POST
auth:
  type: noauth
body:
  type: json
  content: "{\r\n  \"refreshToken\": \"{{refreshToken}}\"\r\n}"
scripts:
  - type: afterResponse
    code: |-
      const resposta = pm.response.json();

      if (pm.response.code === 200 && resposta && resposta.accessToken) {
          pm.collectionVariables.set('accessToken', resposta.accessToken);
          pm.collectionVariables.set('refreshToken', resposta.refreshToken);
      }
    language: text/javascript
order: 4485315013079002
