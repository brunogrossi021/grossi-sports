$kind: collection
variables:
  - key: authLogin
    value: operador.postman
  - key: authPassword
    value: PREENCHA_LOCALMENTE
  - key: newPassword
    value: PREENCHA_LOCALMENTE
  - key: adminLogin
    value: administrador
  - key: adminPassword
    value: PREENCHA_LOCALMENTE
  - key: operatorLogin
    value: operador.autorizacao
  - key: operatorPassword
    value: PREENCHA_LOCALMENTE
  - key: operadorId
    value: ""
  - key: accessToken
    value: ""
  - key: adminAccessToken
    value: ""
  - key: operatorAccessToken
    value: ""
auth:
  type: bearer
  credentials:
    - key: token
      value: "{{accessToken}}"
