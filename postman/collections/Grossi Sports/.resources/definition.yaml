$kind: collection
variables:
  - key: authLogin
    value: operador.postman
  - key: authPassword
    value: PREENCHA_LOCALMENTE
  - key: newPassword
    value: PREENCHA_LOCALMENTE
  - key: accessToken
    value: ""
auth:
  type: bearer
  credentials:
    - key: token
      value: "{{accessToken}}"
