$kind: http-request
name: Login do operador
description: "Rota pública. Autentica com operatorLogin/operatorPassword e grava operatorAccessToken e accessToken (Bearer herdado) para demonstrar as restrições do perfil OPERADOR."
url: http://localhost:8080/api/autenticacao/login
method: POST
auth:
  type: noauth
body:
  type: json
  content: "{\r\n  \"login\": \"{{operatorLogin}}\",\r\n  \"senha\": \"{{operatorPassword}}\"\r\n}"
scripts:
  - type: afterResponse
    code: |-
      const resposta = pm.response.json();

      if (pm.response.code === 200 && resposta && resposta.accessToken) {
          pm.collectionVariables.set('operatorAccessToken', resposta.accessToken);
          pm.collectionVariables.set('accessToken', resposta.accessToken);
      }
    language: text/javascript
order: 4485315013079103
