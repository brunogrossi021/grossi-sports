databaseChangeLog:
  - changeSet:
      id: 006-01-create-cliente
      author: grossi-sports
      changes:
        - createTable:
            tableName: cliente
            columns:
              - column:
                  name: id
                  type: BIGINT
                  autoIncrement: true
                  constraints:
                    primaryKey: true
                    primaryKeyName: pk_cliente
                    nullable: false
              - column:
                  name: pessoa_id
                  type: BIGINT
                  constraints:
                    nullable: false
                    unique: true
                    uniqueConstraintName: uk_cliente_pessoa
              - column:
                  name: telefone
                  type: VARCHAR(30)
      rollback:
        - dropTable:
            tableName: cliente

  - changeSet:
      id: 006-02-fk-cliente-pessoa
      author: grossi-sports
      changes:
        - addForeignKeyConstraint:
            baseTableName: cliente
            baseColumnNames: pessoa_id
            referencedTableName: pessoa
            referencedColumnNames: id
            constraintName: fk_cliente_pessoa
      rollback:
        - dropForeignKeyConstraint:
            baseTableName: cliente
            constraintName: fk_cliente_pessoa

