spring.application.name=grossi-sports
spring.profiles.default=none

spring.datasource.url=${DB_DEV_URL}
spring.datasource.username=${DB_DEV_USERNAME}
spring.datasource.password=${DB_DEV_PASSWORD}
spring.datasource.driver-class-name=org.postgresql.Driver

spring.liquibase.change-log=classpath:db/changelog/db.changelog-master.yaml
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false
springdoc.swagger-ui.operations-sorter=method
springdoc.swagger-ui.tags-sorter=alpha

# Aula 13 - JWT, Bearer Token e OAuth2 Resource Server
# A chave HS256 é lida de JWT_SECRET (arquivo .env, fora do Git).
app.security.jwt.issuer=https://grossi-sports.local
app.security.jwt.expiration=PT30M
app.security.jwt.secret=${JWT_SECRET}

# Aula 16 - Ciclo de vida dos refresh tokens
# idle-timeout: tempo máximo sem renovar antes de a sessão expirar.
# absolute-expiration: limite absoluto da família, independente de uso.
# O limite absoluto precisa ser maior que o de inatividade.
app.security.refresh-token.idle-timeout=${REFRESH_TOKEN_IDLE_TIMEOUT:PT30M}
app.security.refresh-token.absolute-expiration=${REFRESH_TOKEN_ABSOLUTE_EXPIRATION:PT8H}

# Aula 17 - Proteção contra tentativas automatizadas de login
# max-failed-attempts: falhas consecutivas que ativam o bloqueio.
# failure-window: intervalo em que as falhas são agrupadas.
# lock-duration: tempo em que novas tentativas são recusadas.
# Valores didáticos (5 / 15 min / 15 min); ajuste conforme o risco aceito.
app.security.authentication-protection.max-failed-attempts=${AUTH_PROTECTION_MAX_ATTEMPTS:5}
app.security.authentication-protection.failure-window=${AUTH_PROTECTION_FAILURE_WINDOW:PT15M}
app.security.authentication-protection.lock-duration=${AUTH_PROTECTION_LOCK_DURATION:PT15M}

# Aula 14 - Administrador inicial (bootstrap)
# Desativado por padrão. Ative apenas na primeira execução de um banco
# vazio e desative depois. A senha vem do .env (fora do Git).
app.security.initial-admin.enabled=${INITIAL_ADMIN_ENABLED:false}
app.security.initial-admin.nome=${INITIAL_ADMIN_NAME:}
app.security.initial-admin.email=${INITIAL_ADMIN_EMAIL:}
app.security.initial-admin.cpf=${INITIAL_ADMIN_CPF:}
app.security.initial-admin.login=${INITIAL_ADMIN_LOGIN:}
app.security.initial-admin.senha=${INITIAL_ADMIN_PASSWORD:}
