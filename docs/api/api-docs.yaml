      tags:
      - Autenticação
      summary: Encerrar sessão (logout local)
      description: "Revoga a família de refresh tokens identificada pelo token informado.\
        \ Rota pública e idempotente: responde 204 mesmo para token desconhecido.\
        \ Não invalida access tokens já emitidos, que seguem válidos até expirar."
      operationId: logout
      requestBody:
        content:
