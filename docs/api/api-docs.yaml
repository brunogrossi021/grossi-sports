  /api/auditoria-seguranca:
    get:
      tags:
      - Auditoria de segurança
      summary: Consultar eventos de segurança
      description: "Retorna a trilha de auditoria em ordem cronológica decrescente,\
        \ com paginação e filtro opcional por tipo de evento. Restrito a ADMINISTRADOR.\
        \ O DTO não expõe o hash de correlação."
      operationId: consultar
      parameters:
      - name: tipo
        in: query
        description: Filtro opcional por tipo de evento
        required: false
        schema:
          type: string
          enum:
          - LOGIN_SUCESSO
          - LOGIN_FALHA
          - LOGIN_RECUSADO_BLOQUEIO
          - BLOQUEIO_TEMPORARIO_ATIVADO
          - CONTA_CRIADA
          - SENHA_ALTERADA
          - PERFIS_ALTERADOS
          - STATUS_ALTERADO
          - REFRESH_SUCESSO
          - REFRESH_FALHA
          - LOGOUT
          - LOGOUT_GLOBAL
      - name: page
        in: query
        description: Número da página (base zero)
        required: false
        schema:
          type: integer
          format: int32
          default: 0
      - name: size
        in: query
        description: Tamanho da página (1 a 100)
        required: false
        schema:
          type: integer
          format: int32
          default: 20
      responses:
        "200":
          description: Página de eventos retornada
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResponseEventoSegurancaResponse"
        "400":
          description: Parâmetros de consulta inválidos
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Sem token válido
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Sem perfil ADMINISTRADOR
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/vendas/{vendaId}/itens/{itemId}:
    delete:
      tags:
      - Vendas
      summary: Remover item da venda
