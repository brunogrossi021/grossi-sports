openapi: 3.1.0
info:
  title: Grossi Sports API
  description: "API para gerenciamento de produtos esportivos, grupos de produtos,\
    \ fornecedores e movimentações de estoque."
  version: 1.0.0
servers:
- url: http://localhost
  description: Generated server url
security:
- bearerAuth: []
tags:
- name: Clientes
  description: Papel comercial associado a uma pessoa
- name: Colaboradores
  description: Vínculo profissional e função de negócio
- name: Infraestrutura
  description: Rotas públicas de verificação da API
- name: Contas de acesso
  description: Criação e administração de contas (ADMINISTRADOR) e dados da conta
    autenticada
- name: Fornecedores
  description: Gerenciamento de fornecedores de produtos esportivos
- name: Grupos de produtos
  description: Gerenciamento dos grupos de produtos esportivos
- name: Vendas
  description: Gerenciamento de vendas e itens
- name: Pessoas
  description: Identidade civil compartilhada pelos papéis comerciais
- name: Auditoria de segurança
  description: Consulta de eventos de segurança (ADMINISTRADOR)
- name: Produtos
  description: Gerenciamento de produtos esportivos e movimentações de estoque
- name: Autenticação
  description: "Login, renovação e encerramento de sessões"
paths:
  /api/produtos/{id}:
    get:
      tags:
      - Produtos
      summary: Buscar produto por ID
      description: Retorna os dados de um produto específico.
      operationId: buscarPorId
      parameters:
      - name: id
        in: path
        description: Identificador do produto
        required: true
        schema:
          type: integer
          format: int64
        example: 1
      responses:
        "200":
          description: Produto encontrado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProdutoResponse"
        "404":
          description: Produto não encontrado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
    put:
      tags:
      - Produtos
      summary: Editar produto
      description: |
        Atualiza a descrição, o preço unitário, o estoque mínimo,
        o grupo e o fornecedor de um produto existente.
        O saldo de estoque não pode ser alterado por esta operação.
        Para modificar o saldo, utilize os endpoints específicos
        de entrada e saída de estoque.
      operationId: editar
      parameters:
      - name: id
        in: path
        description: Identificador do produto
        required: true
        schema:
          type: integer
          format: int64
        example: 1
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ProdutoUpdateRequest"
        required: true
      responses:
        "200":
          description: Produto atualizado com sucesso
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ProdutoResponse"
        "400":
          description: Dados inválidos
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                timestamp: 2026-10-22T18:30:00Z
                status: 400
                error: Bad Request
                message: Dados inválidos
                path: /api/produtos/1
                fields:
                  descricao: Descrição é obrigatória
        "404":
          description: "Produto, grupo ou fornecedor não encontrado"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                timestamp: 2026-10-22T18:30:00Z
                status: 404
                error: Not Found
                message: Produto não encontrado
                path: /api/produtos/999
                fields: {}
        "409":
          description: Código de barras já cadastrado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
              example:
                timestamp: 2026-10-22T18:30:00Z
                status: 409
                error: Conflict
                message: Código de barras já cadastrado
                path: /api/produtos/1
                fields: {}
  /api/pessoas/{id}:
    get:
      tags:
      - Pessoas
      summary: Buscar pessoa por ID
      description: Retorna uma pessoa pelo seu identificador.
      operationId: buscarPorId_1
      parameters:
      - name: id
        in: path
        description: Identificador da pessoa
        required: true
        schema:
          type: integer
          format: int64
        example: 1
      responses:
        "200":
          description: Pessoa encontrada
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PessoaResponse"
        "404":
          description: Pessoa não encontrada
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
    put:
      tags:
      - Pessoas
      summary: Alterar pessoa
      description: "Atualiza o nome, o e-mail e o CPF. Os papéis comerciais são mantidos."
      operationId: alterar
      parameters:
      - name: id
        in: path
        description: Identificador da pessoa
        required: true
        schema:
          type: integer
          format: int64
        example: 1
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PessoaRequest"
        required: true
      responses:
        "200":
          description: Pessoa atualizada
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PessoaResponse"
        "400":
          description: Dados ou CPF inválidos
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Pessoa não encontrada
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: CPF ou e-mail já cadastrado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/pessoas/{id}/status:
    put:
      tags:
      - Pessoas
      summary: Alterar status da pessoa
      description: Ativa ou inativa uma pessoa cadastrada.
      operationId: alterarStatus
      parameters:
      - name: id
        in: path
        description: Identificador da pessoa
        required: true
        schema:
          type: integer
          format: int64
        example: 1
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatusRequest"
        required: true
      responses:
        "200":
          description: Status alterado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PessoaResponse"
        "400":
          description: Status inválido
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Pessoa não encontrada
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/grupos-produtos/{id}:
    get:
      tags:
      - Grupos de produtos
      summary: Buscar grupo de produtos por ID
      description: Retorna os dados de um grupo de produtos específico.
      operationId: buscarPorId_2
      parameters:
      - name: id
        in: path
        description: Identificador do grupo
        required: true
        schema:
          type: integer
          format: int64
        example: 1
      responses:
        "200":
          description: Grupo encontrado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/GrupoProdutoResponse"
        "404":
          description: Grupo não encontrado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                Grupo não encontrado:
                  description: Grupo não encontrado
                  value:
                    timestamp: 2026-10-22T18:30:00Z
                    status: 404
                    error: Not Found
                    message: Grupo não encontrado
                    path: /api/grupos-produtos/999
                    fields: {}
    put:
      tags:
      - Grupos de produtos
      summary: Editar grupo de produtos
      description: Atualiza o nome de um grupo de produtos existente.
      operationId: editar_1
      parameters:
      - name: id
        in: path
        description: Identificador do grupo
        required: true
        schema:
          type: integer
          format: int64
        example: 1
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/GrupoProdutoRequest"
        required: true
      responses:
        "200":
          description: Grupo atualizado com sucesso
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/GrupoProdutoResponse"
        "400":
          description: Dados inválidos
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                Dados inválidos:
                  description: Dados inválidos
                  value:
                    timestamp: 2026-10-22T18:30:00Z
                    status: 400
                    error: Bad Request
                    message: Dados inválidos
                    path: /api/grupos-produtos/1
                    fields:
                      nome: O nome é obrigatório
        "404":
          description: Grupo não encontrado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                Grupo não encontrado:
                  description: Grupo não encontrado
                  value:
                    timestamp: 2026-10-22T18:30:00Z
                    status: 404
                    error: Not Found
                    message: Grupo não encontrado
                    path: /api/grupos-produtos/999
                    fields: {}
        "409":
          description: Já existe um grupo com esse nome
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                Nome de grupo duplicado:
                  description: Nome de grupo duplicado
                  value:
                    timestamp: 2026-10-22T18:30:00Z
                    status: 409
                    error: Conflict
                    message: Já existe um grupo com esse nome
                    path: /api/grupos-produtos/1
                    fields: {}
    delete:
      tags:
      - Grupos de produtos
      summary: Excluir grupo de produtos
      description: "Exclui um grupo de produtos, desde que não existam produtos associados."
      operationId: excluir
      parameters:
      - name: id
        in: path
        description: Identificador do grupo
        required: true
        schema:
          type: integer
          format: int64
        example: 1
      responses:
        "204":
          description: Grupo excluído com sucesso
        "404":
          description: Grupo não encontrado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                Grupo não encontrado:
                  description: Grupo não encontrado
                  value:
                    timestamp: 2026-10-22T18:30:00Z
                    status: 404
                    error: Not Found
                    message: Grupo não encontrado
                    path: /api/grupos-produtos/999
                    fields: {}
        "409":
          description: Grupo possui produtos associados
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
              examples:
                Grupo possui produtos associados:
                  description: Grupo possui produtos associados
                  value:
                    timestamp: 2026-10-22T18:30:00Z
                    status: 409
                    error: Conflict
                    message: Grupo possui produtos associados
                    path: /api/grupos-produtos/1
                    fields: {}
  /api/contas-acesso/{id}/status:
    put:
      tags:
      - Contas de acesso
      summary: Ativar ou bloquear conta
      description: Ativa ou bloqueia a conta. Restrito a ADMINISTRADOR. Não permite
        bloquear a própria conta nem o último administrador ativo.
      operationId: alterarStatus_1
      parameters:
      - name: id
        in: path
        description: Identificador da conta
        required: true
        schema:
          type: integer
          format: int64
        example: 1
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/StatusContaAcessoRequest"
        required: true
      responses:
        "200":
          description: Status alterado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ContaAcessoResponse"
        "400":
          description: Status inválido ou invariante administrativa violada
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Sem token válido
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Sem perfil ADMINISTRADOR
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Conta de acesso não encontrada
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/contas-acesso/{id}/perfis:
    put:
      tags:
      - Contas de acesso
      summary: Alterar perfis da conta
      description: "Substitui os perfis de acesso. Restrito a ADMINISTRADOR. Não permite\
        \ deixar a conta sem perfil, remover o próprio perfil administrativo nem remover\
        \ o perfil do último administrador ativo."
      operationId: alterarPerfis
      parameters:
      - name: id
        in: path
        description: Identificador da conta
        required: true
        schema:
          type: integer
          format: int64
        example: 1
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PerfisContaAcessoRequest"
        required: true
      responses:
        "200":
          description: Perfis atualizados
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ContaAcessoResponse"
        "400":
          description: Perfis inválidos ou invariante administrativa violada
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "401":
          description: Sem token válido
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "403":
          description: Sem perfil ADMINISTRADOR
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Conta de acesso não encontrada
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/contas-acesso/me/senha:
    put:
      tags:
      - Contas de acesso
      summary: Alterar minha senha
      description: Exige a senha atual e grava apenas o novo hash.
      operationId: alterarSenha
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AlterarSenhaContaRequest"
        required: true
      responses:
        "204":
          description: Senha alterada
        "400":
          description: Senha atual inválida ou nova senha inválida
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Conta de acesso não encontrada
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/colaboradores/{id}:
    get:
      tags:
      - Colaboradores
      summary: Buscar colaborador por ID
      description: Retorna um colaborador e os dados da pessoa associada.
      operationId: buscarPorId_3
      parameters:
      - name: id
        in: path
        description: Identificador do colaborador
        required: true
        schema:
          type: integer
          format: int64
        example: 1
      responses:
        "200":
          description: Colaborador encontrado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ColaboradorResponse"
        "404":
          description: Colaborador não encontrado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
    put:
      tags:
      - Colaboradores
      summary: Alterar colaborador
      description: Altera matrícula e função de negócio. Não concede permissões de
        acesso.
      operationId: alterar_1
      parameters:
      - name: id
        in: path
        description: Identificador do colaborador
        required: true
        schema:
          type: integer
          format: int64
        example: 1
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ColaboradorAtualizacaoRequest"
        required: true
      responses:
        "200":
          description: Colaborador atualizado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ColaboradorResponse"
        "400":
          description: Dados inválidos
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Colaborador não encontrado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "409":
          description: Matrícula já cadastrada
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/clientes/{id}:
    get:
      tags:
      - Clientes
      summary: Buscar cliente por ID
      description: Retorna um cliente e os dados da pessoa associada.
      operationId: buscarPorId_4
      parameters:
      - name: id
        in: path
        description: Identificador do cliente
        required: true
        schema:
          type: integer
          format: int64
        example: 1
      responses:
        "200":
          description: Cliente encontrado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ClienteResponse"
        "404":
          description: Cliente não encontrado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
    put:
      tags:
      - Clientes
      summary: Alterar cliente
      description: "Altera o telefone do cliente. Nome, e-mail e CPF são alterados\
        \ em /api/pessoas/{id}."
      operationId: alterar_2
      parameters:
      - name: id
        in: path
        description: Identificador do cliente
        required: true
        schema:
          type: integer
          format: int64
        example: 1
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ClienteAtualizacaoRequest"
        required: true
      responses:
        "200":
          description: Cliente atualizado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ClienteResponse"
        "400":
          description: Dados inválidos
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Cliente não encontrado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/vendas:
    get:
      tags:
      - Vendas
      summary: Pesquisar vendas
      description: "Lista resumos de vendas filtrando por status, participantes e\
        \ intervalo inclusivo de datas."
      operationId: pesquisar
      parameters:
      - name: pagina
        in: query
        description: "Número da página, começando em zero"
        required: false
        schema:
          type: integer
          format: int32
          default: 0
        example: 0
      - name: tamanho
        in: query
        description: Quantidade de vendas por página
        required: false
        schema:
          type: integer
          format: int32
          default: 10
        example: 10
      - name: ordenarPor
        in: query
        description: Campo usado para ordenação
        required: false
        schema:
          type: string
          default: dataAbertura
        example: dataAbertura
      - name: direcao
        in: query
        description: "Direção da ordenação: asc ou desc"
        required: false
        schema:
          type: string
          default: desc
        example: desc
      - name: status
        in: query
        description: Filtra pelo status da venda
        required: false
        schema:
          type: string
          enum:
          - ABERTA
          - FINALIZADA
          - CANCELADA
        example: ABERTA
      - name: clienteId
        in: query
        description: Filtra pelo identificador do cliente
        required: false
        schema:
          type: integer
          format: int64
        example: 1
      - name: vendedorId
        in: query
        description: Filtra pelo identificador do vendedor
        required: false
        schema:
          type: integer
          format: int64
        example: 1
      - name: dataInicial
        in: query
        description: "Data inicial do período, inclusive"
        required: false
        schema:
          type: string
          format: date
        example: 2026-11-01
      - name: dataFinal
        in: query
        description: "Data final do período, inclusive"
        required: false
        schema:
          type: string
          format: date
        example: 2026-11-30
      responses:
        "200":
          description: Lista de vendas retornada
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/PageResponseVendaResumoResponse"
        "400":
          description: Parâmetros inválidos
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
    post:
      tags:
      - Vendas
      summary: Abrir venda
      description: Cria uma venda ABERTA para um cliente e um vendedor ativos.
      operationId: abrirVenda
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/VendaRequest"
        required: true
      responses:
        "201":
          description: Venda aberta com sucesso
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/VendaResponse"
        "400":
          description: Dados inválidos
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Cliente ou colaborador não encontrado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/vendas/{id}/itens:
    post:
      tags:
      - Vendas
      summary: Adicionar item à venda
      description: Captura o preço atual do produto; somente vendas abertas aceitam
        itens.
      operationId: adicionarItem
      parameters:
      - name: id
        in: path
        description: Identificador da venda
        required: true
        schema:
          type: integer
          format: int64
        example: 1
      requestBody:
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ItemVendaRequest"
        required: true
      responses:
        "200":
          description: Item adicionado com sucesso
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/VendaResponse"
        "400":
          description: Dados inválidos ou venda não está aberta
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Venda ou produto não encontrado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/vendas/{id}/finalizacao:
    post:
      tags:
      - Vendas
      summary: Finalizar venda
      description: "Valida toda a venda, bloqueia os produtos em ordem determinística\
        \ e baixa o estoque de todos os itens na mesma transação."
      operationId: finalizar
      parameters:
      - name: id
        in: path
        description: Identificador da venda
        required: true
        schema:
          type: integer
          format: int64
        example: 1
      responses:
        "200":
          description: Venda finalizada com sucesso
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/VendaResponse"
        "400":
          description: "Venda vazia, estoque insuficiente ou estado inválido"
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Venda ou produto não encontrado
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
  /api/vendas/{id}/cancelamento:
    post:
      tags:
      - Vendas
      summary: Cancelar venda
      description: "Cancela uma venda ainda aberta; como não houve baixa, não há estorno\
        \ de estoque."
      operationId: cancelar
      parameters:
      - name: id
        in: path
        description: Identificador da venda
        required: true
        schema:
          type: integer
          format: int64
        example: 1
      responses:
        "200":
          description: Venda cancelada com sucesso
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/VendaResponse"
        "400":
          description: Venda não está aberta
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Venda não encontrada
          content:
            '*/*':
