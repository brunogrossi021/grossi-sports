      description: "Exige Bearer Token. Revoga todas as sessões renováveis da conta\
        \ autenticada. Responde 204 e não invalida access tokens já emitidos, que\
        \ seguem válidos até expirar."
      operationId: logoutTodos
      responses:
        "204":
          description: Sessões encerradas
        "401":
          description: Token ausente ou inválido
