    EventoSegurancaResponse:
      type: object
      description: Evento de segurança da trilha de auditoria; não expõe o hash de
        correlação nem segredos
      properties:
        id:
          type: integer
          format: int64
          description: Identificador do evento
          example: 42
        tipo:
          type: string
          description: Tipo do evento
          enum:
          - LOGIN_SUCESSO
          - LOGIN_FALHA
          - LOGIN_RECUSADO_BLOQUEIO
          - BLOQUEIO_TEMPORARIO_ATIVADO
          - CONTA_CRIADA
          - SENHA_ALTERADA
          - PERFIS_ALTERADOS
          - STATUS_ALTERADO
          - REFRESH_SUCESSO
          - REFRESH_FALHA
          - LOGOUT
          - LOGOUT_GLOBAL
          example: LOGIN_FALHA
        ocorridoEm:
          type: string
          format: date-time
          description: Instante em que o evento ocorreu
          example: 2026-11-15T12:00:00Z
        atorContaId:
          type: integer
          format: int64
          description: "Conta que iniciou a ação, quando conhecida"
          example: 1
        alvoContaId:
          type: integer
          format: int64
          description: "Conta afetada, quando conhecida"
          example: 2
        enderecoOrigem:
          type: string
          description: Endereço de origem observado da requisição
          example: 127.0.0.1
    PageResponseEventoSegurancaResponse:
