      operationId: removerItem
      parameters:
      - name: vendaId
        in: path
        description: Identificador da venda
        required: true
        schema:
          type: integer
          format: int64
        example: 1
      - name: itemId
        in: path
        description: Identificador do item
        required: true
        schema:
          type: integer
          format: int64
        example: 1
      responses:
        "200":
          description: Item removido com sucesso
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/VendaResponse"
        "400":
          description: Item não encontrado ou venda não está aberta
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
        "404":
          description: Venda não encontrada
          content:
            '*/*':
              schema:
                $ref: "#/components/schemas/ApiError"
components:
  schemas:
    ProdutoUpdateRequest:
      type: object
      description: Dados para atualizar um produto esportivo existente
      properties:
        descricao:
          type: string
          description: Nova descrição do produto
          example: Bola de futebol profissional
          maxLength: 150
          minLength: 0
        valorUnitario:
          type: number
          description: Novo preço unitário do produto
          example: 179.9
          minimum: 0
        estoqueMinimo:
          type: number
          description: Quantidade mínima desejada em estoque
          example: 5
          minimum: 0
        grupoId:
          type: integer
          format: int64
          description: Identificador do grupo do produto
          example: 1
          exclusiveMinimum: 0
        fornecedorId:
          type: integer
          format: int64
          description: Identificador do fornecedor do produto
          example: 1
          exclusiveMinimum: 0
      required:
      - descricao
      - estoqueMinimo
      - grupoId
      - valorUnitario
    ApiError:
      type: object
      description: Detalhes de uma resposta de erro da API
      example:
        timestamp: 2026-10-22T18:30:00Z
        status: 400
        error: Bad Request
        message: Dados inválidos
        path: /api/produtos
        fields:
          descricao: Descrição é obrigatória
      properties:
        timestamp:
          type: string
          format: date-time
          description: Data e hora em que o erro ocorreu
          example: 2026-10-22T18:30:00Z
        status:
          type: integer
          format: int32
          description: Código HTTP do erro
          example: 404
        error:
          type: string
          description: Descrição do tipo de erro HTTP
          example: Not Found
        message:
          type: string
          description: Mensagem explicando o erro
          example: Produto não encontrado
        path:
          type: string
          description: Caminho da requisição que gerou o erro
          example: /api/produtos/999
        fields:
          type: object
          additionalProperties:
            type: string
          description: "Detalhes dos campos inválidos, quando aplicável"
          example:
            descricao: A descrição é obrigatória
            valorUnitario: Deve ser maior que zero
    ProdutoResponse:
      type: object
      description: Dados de um produto esportivo retornados pela API
      properties:
        id:
          type: integer
          format: int64
          description: Identificador único do produto
          example: 1
        codigoBarras:
          type: string
          description: Código de barras do produto
          example: "7891234567890"
        descricao:
          type: string
          description: Descrição ou nome do produto
          example: Bola de futebol
        saldoEstoque:
          type: number
          description: Quantidade atual disponível em estoque
          example: 20
        valorUnitario:
          type: number
          description: Preço unitário do produto
          example: 149.9
        estoqueMinimo:
          type: number
          description: Quantidade mínima desejada em estoque
          example: 5
        valorEstoque:
          type: number
          description: "Valor total do estoque, calculado a partir do saldo e do preç\
            o unitário"
          example: 2998.0
        dataCadastro:
          type: string
          format: date
          description: Data de cadastro do produto
          example: 2026-10-22
        status:
          type: string
          description: Situação atual do produto
          enum:
          - ATIVO
          - INATIVO
          example: ATIVO
        grupoId:
          type: integer
          format: int64
          description: Identificador do grupo do produto
          example: 1
        grupoNome:
          type: string
          description: Nome do grupo ao qual o produto pertence
          example: Bolas
        fornecedorId:
          type: integer
          format: int64
          description: Identificador do fornecedor do produto
          example: 1
        fornecedorRazaoSocial:
          type: string
          description: Razão social do fornecedor do produto
          example: Fornecedor Esportivo LTDA
    PessoaRequest:
      type: object
      description: Dados necessários para cadastrar uma pessoa
      properties:
        nome:
          type: string
          description: Nome completo da pessoa
          example: Bruno Henrique
          maxLength: 150
          minLength: 0
        email:
          type: string
          format: email
          description: E-mail da pessoa
          example: bruno@email.com
          maxLength: 180
          minLength: 0
        cpf:
          type: string
          description: "CPF contendo exatamente 11 dígitos, sem pontuação"
          example: "52998224725"
          minLength: 1
          pattern: "\\d{11}"
      required:
      - cpf
      - email
      - nome
    PessoaResponse:
      type: object
      description: Dados retornados de uma pessoa
      properties:
        id:
          type: integer
          format: int64
          description: Identificador da pessoa
          example: 1
        nome:
          type: string
          description: Nome completo
          example: Bruno Henrique
        email:
          type: string
          description: E-mail
          example: bruno@email.com
        cpf:
          type: string
          description: CPF com 11 dígitos
          example: "52998224725"
        dataCadastro:
          type: string
          format: date
          description: Data de cadastro
          example: 2026-10-31
        status:
          type: string
          description: Status da pessoa
          enum:
          - ATIVO
          - INATIVO
          example: ATIVO
    StatusRequest:
      type: object
      description: Dados necessários para alterar o status de uma pessoa
      properties:
        status:
          type: string
          description: Novo status da pessoa
          enum:
          - ATIVO
          - INATIVO
          example: ATIVO
      required:
      - status
    GrupoProdutoRequest:
      type: object
      description: Dados necessários para cadastrar ou editar um grupo de produtos
      properties:
        nome:
          type: string
          description: Nome do grupo de produtos
          example: Bolas
          maxLength: 120
          minLength: 0
      required:
      - nome
    GrupoProdutoResponse:
      type: object
      description: Dados de um grupo de produtos retornados pela API
      properties:
        id:
          type: integer
          format: int64
          description: Identificador único do grupo
          example: 1
        nome:
          type: string
          description: Nome do grupo de produtos
          example: Bolas
        status:
          type: string
          description: Situação atual do grupo
          enum:
          - ATIVO
          - INATIVO
          example: ATIVO
    StatusContaAcessoRequest:
      type: object
      description: "Novo status da conta de acesso: ativa ou bloqueada."
      properties:
        status:
          type: string
          description: Status desejado da conta
          enum:
          - ATIVA
          - BLOQUEADA
          example: BLOQUEADA
      required:
      - status
    ContaAcessoResponse:
      type: object
      description: Conta autenticável; nunca contém senha ou hash
      properties:
        id:
          type: integer
          format: int64
          description: Identificador da conta
          example: 1
        pessoaId:
          type: integer
          format: int64
          description: Identificador da pessoa vinculada
          example: 1
        nomePessoa:
          type: string
          description: Nome da pessoa vinculada
          example: Ana Souza
        login:
          type: string
          description: Login de acesso
          example: ana.souza
        status:
          type: string
          description: Status da conta
          enum:
          - ATIVA
          - BLOQUEADA
          example: ATIVA
        perfis:
          type: array
          description: Perfis de acesso concedidos
          example:
          - OPERADOR
          items:
            type: string
            enum:
            - OPERADOR
            - ADMINISTRADOR
          uniqueItems: true
    PerfisContaAcessoRequest:
      type: object
      description: Perfis de acesso que substituirão os perfis atuais da conta. Deve
        conter ao menos um perfil.
      properties:
        perfis:
          type: array
          description: Conjunto de perfis de acesso
          example:
          - OPERADOR
          - ADMINISTRADOR
          items:
            type: string
            enum:
            - OPERADOR
            - ADMINISTRADOR
          minItems: 1
          uniqueItems: true
      required:
      - perfis
    AlterarSenhaContaRequest:
      type: object
      description: Dados para alterar a senha da própria conta
      properties:
        senhaAtual:
          type: string
          description: Senha atual da conta
          minLength: 1
        novaSenha:
          type: string
          description: Nova senha com no mínimo 12 caracteres e no máximo 72 bytes
            em UTF-8
          maxLength: 72
          minLength: 12
      required:
      - novaSenha
      - senhaAtual
    ColaboradorAtualizacaoRequest:
      type: object
      description: Dados para atualizar o cadastro de um colaborador
      properties:
        matricula:
          type: string
          description: Matrícula do colaborador
          example: MAT-002
          maxLength: 20
          minLength: 0
        funcao:
          type: string
          description: Função exercida pelo colaborador
          enum:
          - VENDEDOR
          - ESTOQUISTA
          - GERENTE
          - ADMINISTRATIVO
          example: VENDEDOR
    ColaboradorResponse:
      type: object
      description: Dados retornados de um colaborador
      properties:
        id:
          type: integer
          format: int64
          example: 1
        pessoaId:
          type: integer
          format: int64
          example: 1
        nome:
          type: string
          example: Bruno Henrique
        email:
          type: string
          example: bruno@email.com
        cpf:
          type: string
          example: "52998224725"
        status:
          type: string
          enum:
          - ATIVO
          - INATIVO
          example: ATIVO
        matricula:
          type: string
          example: MAT-001
        funcao:
          type: string
          enum:
          - VENDEDOR
          - ESTOQUISTA
          - GERENTE
          - ADMINISTRATIVO
          example: VENDEDOR
        dataAdmissao:
          type: string
          format: date
          example: 2026-01-01
    ClienteAtualizacaoRequest:
      type: object
      description: Dados para atualizar o cadastro de um cliente
      properties:
        telefone:
          type: string
          description: Telefone de contato do cliente
          example: "17999999999"
          maxLength: 30
          minLength: 0
    ClienteResponse:
      type: object
      description: Dados retornados de um cliente
      properties:
        id:
          type: integer
          format: int64
          example: 1
        pessoaId:
          type: integer
          format: int64
          example: 1
        nome:
          type: string
          example: Bruno Henrique
        email:
          type: string
          example: bruno@email.com
        cpf:
          type: string
          example: "52998224725"
        status:
          type: string
          enum:
          - ATIVO
          - INATIVO
          example: ATIVO
        telefone:
          type: string
          example: "17999999999"
    VendaRequest:
      type: object
      description: Dados necessários para abrir uma venda
      properties:
        clienteId:
          type: integer
          format: int64
          description: Identificador do cliente
          example: 1
          exclusiveMinimum: 0
        vendedorId:
          type: integer
          format: int64
          description: Identificador do colaborador vendedor
          example: 1
          exclusiveMinimum: 0
      required:
      - clienteId
      - vendedorId
    ItemVendaResponse:
      type: object
      description: Dados retornados de um item da venda
      properties:
        id:
          type: integer
          format: int64
          example: 1
        produtoId:
          type: integer
          format: int64
          example: 1
        produtoDescricao:
          type: string
          example: Chuteira de campo
        quantidade:
          type: number
          example: 2.0
        valorUnitario:
          type: number
          example: 299.9
        subtotal:
          type: number
          example: 599.8
    VendaResponse:
      type: object
      description: Dados completos de uma venda
      properties:
        id:
          type: integer
          format: int64
          example: 1
        clienteId:
          type: integer
          format: int64
          example: 1
        clienteNome:
          type: string
          example: Bruno Henrique
        vendedorId:
          type: integer
          format: int64
          example: 1
        vendedorNome:
          type: string
          example: Carlos Silva
        dataVenda:
          type: string
          format: date-time
          example: 2026-11-04T20:00:00
        status:
          type: string
          enum:
          - ABERTA
          - FINALIZADA
          - CANCELADA
          example: ABERTA
        itens:
          type: array
          items:
            $ref: "#/components/schemas/ItemVendaResponse"
        total:
          type: number
          example: 599.8
    ItemVendaRequest:
      type: object
      description: Dados necessários para adicionar um item à venda
      properties:
        produtoId:
          type: integer
          format: int64
          description: Identificador do produto
          example: 1
          exclusiveMinimum: 0
        quantidade:
          type: number
          description: Quantidade do produto
          example: 2.0
          minimum: 0.001
      required:
      - produtoId
      - quantidade
    ProdutoRequest:
      type: object
      description: Dados necessários para cadastrar um produto esportivo
      properties:
        codigoBarras:
          type: string
          description: Código de barras do produto
          example: "7891234567890"
          maxLength: 50
          minLength: 0
        descricao:
          type: string
          description: Descrição ou nome do produto
          example: Bola de futebol
          maxLength: 150
          minLength: 0
        saldoEstoque:
          type: number
          description: Quantidade inicial disponível em estoque
          example: 20
          minimum: 0
        valorUnitario:
          type: number
          description: Preço unitário do produto
          example: 149.9
          minimum: 0
        estoqueMinimo:
          type: number
          description: Quantidade mínima desejada em estoque
          example: 5
          minimum: 0
        grupoId:
          type: integer
          format: int64
          description: Identificador do grupo ao qual o produto pertence
          example: 1
          exclusiveMinimum: 0
        fornecedorId:
          type: integer
          format: int64
          description: Identificador do fornecedor do produto
          example: 1
          exclusiveMinimum: 0
      required:
      - codigoBarras
      - descricao
      - estoqueMinimo
      - grupoId
      - saldoEstoque
      - valorUnitario
    MovimentacaoEstoqueRequest:
      type: object
      properties:
        quantidade:
          type: number
          minimum: 0.001
      required:
      - quantidade
    FornecedorRequest:
      type: object
      description: Dados necessários para cadastrar um fornecedor
      properties:
        razaoSocial:
          type: string
          description: Razão social do fornecedor
          example: Fornecedor Esportivo LTDA
          maxLength: 150
          minLength: 0
        cnpj:
          type: string
          description: "CNPJ do fornecedor contendo exatamente 14 dígitos, sem pontuaç\
            ão"
          example: "11222333000181"
          minLength: 1
          pattern: "\\d{14}"
      required:
      - cnpj
      - razaoSocial
    FornecedorResponse:
      type: object
      description: Dados de um fornecedor retornados pela API
      properties:
        id:
          type: integer
          format: int64
          description: Identificador único do fornecedor
          example: 1
        razaoSocial:
          type: string
          description: Razão social do fornecedor
          example: Fornecedor Esportivo LTDA
        cnpj:
          type: string
          description: "CNPJ do fornecedor, contendo 14 dígitos"
          example: "12345678000199"
        status:
          type: string
          description: Situação atual do fornecedor
          enum:
          - ATIVO
          - INATIVO
          example: ATIVO
    ContaAcessoRequest:
      type: object
      description: "Dados para a criação administrativa: cria a pessoa e a conta de\
        \ acesso na mesma requisição, sempre com o perfil OPERADOR. Operação restrita\
        \ a ADMINISTRADOR. Não aceita pessoa existente nem perfil de acesso."
      properties:
        nome:
          type: string
          description: Nome completo da pessoa
          example: Ana Souza
          maxLength: 150
          minLength: 0
        email:
          type: string
          format: email
          description: E-mail da pessoa
          example: ana.souza@example.com
          maxLength: 180
          minLength: 0
        cpf:
          type: string
          description: "CPF contendo exatamente 11 dígitos, sem pontuação"
          example: "52998224725"
          minLength: 1
          pattern: "\\d{11}"
        login:
          type: string
          description: "Login de acesso, único e sem diferenciar maiúsculas"
          example: ana.souza
          maxLength: 80
          minLength: 3
          pattern: "^[A-Za-z0-9._-]+$"
        senha:
          type: string
          description: Senha com no mínimo 12 caracteres e no máximo 72 bytes em UTF-8
          example: uma-frase-senha-2026
          maxLength: 72
          minLength: 12
      required:
      - cpf
      - email
      - login
      - nome
      - senha
    ColaboradorRequest:
      type: object
      description: Dados necessários para cadastrar um colaborador
      properties:
        pessoaId:
          type: integer
          format: int64
          description: Identificador da pessoa associada ao colaborador
          example: 1
          exclusiveMinimum: 0
        matricula:
          type: string
          description: Matrícula do colaborador
          example: MAT-001
          maxLength: 20
          minLength: 0
        funcao:
          type: string
          description: Função exercida pelo colaborador
          enum:
          - VENDEDOR
          - ESTOQUISTA
          - GERENTE
          - ADMINISTRATIVO
          example: VENDEDOR
        dataAdmissao:
          type: string
          format: date
          description: Data de admissão do colaborador
          example: 2026-01-01
      required:
      - dataAdmissao
      - funcao
      - matricula
      - pessoaId
    ClienteRequest:
      type: object
      description: Dados necessários para cadastrar um cliente
      properties:
        pessoaId:
          type: integer
          format: int64
          description: Identificador da pessoa associada ao cliente
          example: 1
          exclusiveMinimum: 0
        telefone:
          type: string
          description: Telefone de contato do cliente
          example: "17999999999"
          maxLength: 30
          minLength: 0
      required:
      - pessoaId
    RefreshTokenRequest:
      type: object
      description: Refresh token opaco emitido no login ou na renovação
      properties:
        refreshToken:
          type: string
          description: Refresh token opaco (32 bytes em Base64 URL)
          minLength: 1
      required:
      - refreshToken
    TokenResponse:
      type: object
      description: Par de tokens emitido no login e na renovação (Aula 16)
      properties:
        accessToken:
          type: string
          description: JWT assinado em HS256
          example: eyJraWQiOi...
        tokenType:
          type: string
          description: Tipo do token
          example: Bearer
        expiresIn:
          type: integer
          format: int64
          description: Validade do access token em segundos
          example: 1800
        expiresAt:
          type: string
          format: date-time
          description: Instante de expiração do access token
          example: 2026-10-29T21:30:00Z
        refreshToken:
          type: string
          description: "Refresh token opaco; só existe em claro nesta resposta, pois\
            \ o servidor guarda apenas o hash"
          example: 8fJ2s1kQ...
        refreshTokenExpiresAt:
          type: string
          format: date-time
          description: Limite absoluto da sessão renovável
          example: 2026-10-30T05:30:00Z
    LoginRequest:
      type: object
      description: Credenciais para autenticação e emissão do token
      properties:
        login:
          type: string
          description: Login da conta
          example: operador.postman
          maxLength: 80
          minLength: 0
        senha:
          type: string
          description: Senha da conta
          maxLength: 72
          minLength: 0
      required:
      - login
      - senha
